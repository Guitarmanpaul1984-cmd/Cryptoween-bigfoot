services:
  - type: worker
    name: bigfoot-cryptoween
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: DAILY_PROPHECY_HOUR_UTC
        value: "15"
      - key: DB_PATH
        value: /data/bigfoot.db
    disk:
      name: bigfoot-data
      mountPath: /data
      sizeGB: 1
